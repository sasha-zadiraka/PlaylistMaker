[versions]
agp = "8.11.2"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.10.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
moxy = "2.2.2"
koin-bom = "4.1.1"
coroutines = "1.10.2"
ksp = "2.0.21-1.0.28"
room = "2.8.4"
composeBom = "2025.06.01"
navigationCompose = "2.8.9"
lifecycleCompose = "2.8.7"
